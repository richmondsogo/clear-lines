[package]
name = "clear-lines"
version = "0.1.0"
description = "A quiet desktop notes application"
authors = ["Clear Lines"]
edition = "2021"

[lib]
name = "clear_lines_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

